# void omnibus, issue 33: the score's note data (E8). Rendered by build.py; checked by audit.py.
# Rows are [instrument, sounding note, at_s, dur_s, velocity, release_s (optional)], in seconds on the cue's own clock
# (tempo 60, so a beat is a second). `at_s` is where the bow or breath starts: a bowed vibraphone bar swells for about
# 0.8 s before it speaks, a string section for about 0.6 s, so arrivals sit that far after the row's time.
# Instruments come from score-tools library.yaml (sha256 pinned in score.take.json) by name, plus the few samples of the
# same two CC0 libraries the library does not list (add_samples), each pinned here by its own sha256 and URL.
slug: omnibus-33
tempo_bpm: 60
rate: 48000

