# Daily snapshot of void news's printed day (show bible, section h, stage 1):
# scripts/snapshot.mjs captures it, scripts/snapshot-r2.mjs stores it in the
# R2 bucket `omnibus` under snapshots/<printed date>/. void news keeps a
# cluster's deep dive only while the cluster is printed, so a day not
# captured is lost for good; that is why this runs every day.
#
# Rule 10 (Agentique CLAUDE.md) declaration:
#   owner: Studio (omnibus)
#   kill_after_idle_days: 21
#   heartbeat_url: https://omnibus.voidvision.org/api/snapshots/heartbeat
#
# The bible's capture time is 12:00 UTC; the runs sit at :17 and :43, off the
# top and half hour when GitHub's scheduler is busiest and runs start late.
# void news has printed as late as 21:12 UTC, so 23:43 catches a late
# edition the same day. Snapshots are keyed by the edition's printed date; a
# run that finds the same edition again writes only the heartbeat, and a
# capture that holds less than R2 never removes anything.
#
# Needs the repo secret CLOUDFLARE_API_TOKEN (Account, Workers R2 Storage,
# Edit) and the repo variable CLOUDFLARE_ACCOUNT_ID (not a secret). Without
# the token the capture still runs and is kept as a workflow artifact for 90
# days, as is any capture R2 refused (backfill: `node scripts/snapshot-r2.mjs
# --root <downloaded artifacts>`); the R2 step is skipped with a warning.
# verify-production.yml checks the heartbeat once the repo variable
# SNAPSHOT_R2_ENABLED is "true".
name: snapshot

on:
  schedule:
    - cron: "17 12 * * *"
    - cron: "43 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_R2: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Capture the printed day
        id: capture
        run: node scripts/snapshot.mjs --out snapshots-out
      - name: Store it in R2
        if: ${{ env.HAS_R2 == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/snapshot-r2.mjs --dir "snapshots-out/${{ steps.capture.outputs.date }}"
      - name: R2 is not configured
        if: ${{ env.HAS_R2 != 'true' }}
        run: |
          echo "::warning title=Snapshot not stored in R2::The repo secret CLOUDFLARE_API_TOKEN is not set, so ${{ steps.capture.outputs.date }} was kept only as this run's artifact (90 days). Add the secret, then backfill with node scripts/snapshot-r2.mjs --root <downloaded artifacts>."
      # The capture is kept whenever it did not reach R2, so no printed day
      # is lost while the secret is missing or R2 is down.
      - name: Keep the capture as a workflow artifact
        if: ${{ always() && steps.capture.outcome == 'success' && (env.HAS_R2 != 'true' || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ steps.capture.outputs.date }}-${{ github.run_id }}
          path: snapshots-out/
          retention-days: 90
          if-no-files-found: error
