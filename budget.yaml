# Free-tier budget for omnibus. `estimate_at_1000_users_per_day` is the number
# the brief and the G3 launch packet quote; `ceiling` is the platform's actual
# free-tier limit. The launch quota dry-run fails once any estimate crosses
# `alert_at` of its ceiling. Workers requests and D1 rows written are quotas of
# the whole Cloudflare account, shared by every product on it, not per product.
alert_at: 0.7

quotas:
  - name: workers_requests_per_day
    ceiling: 100000
    estimate_at_1000_users_per_day: 3000
    notes: "Account-wide. ~3 Worker requests per visitor a day: a couple of /e events and occasional /feedback. Static pages, scripts, styles and fonts are served by Workers Static Assets without invoking the Worker (wrangler.jsonc's run_worker_first lists only the Worker routes), so they do not count here. Not bounded against abuse on the free plan: a refused request is still an invocation. The zone's WAF rule caps bursts (the /release skill), and the rest is an accepted risk signed at G3 (the /launch skill)."

  - name: d1_rows_read_per_day
    ceiling: 5000000
    estimate_at_1000_users_per_day: 20000
    notes: "Each counted request reads its counter row; /healthz and the rate-limit check do not touch D1."

  - name: d1_rows_written_per_day
    ceiling: 100000
    estimate_at_1000_users_per_day: 3000
    worst_case_rows: 12605
    worst_case_max_share: 0.15
    notes: "Account-wide. Typical is ~3,000 (one counter update per /e call, occasional feedback). Every write path sits behind a day ceiling that writes nothing once reached, so this product's writes are bounded by the sum of ceiling x rows-per-count, index entries included (worker/src/config.ts's worstCaseDailyWrites, with wrangler.jsonc's values): /e client events (page_view, episode_completed, week_opened) 3 x (3,000 + 1 + a daily feedback purge of up to 2 x the 100-row feedback ceiling, 2 rows each) = 10,203; feedback 100 x 22 + 101 = 2,301; rate_limiter_error 101. Worst case 12,605 rows, 12.6% of the account's 100,000; worst_case_max_share caps it at 15%, so four live products at their caps stay under the 70% alert together. tests/hardening.test.ts recomputes worst_case_rows from wrangler.jsonc and checks the share. Refused requests (rate limit, cross-site, content type, ceilings) write nothing."

  - name: d1_storage_mb
    ceiling: 500
    estimate_at_1000_users_per_day: 40
    notes: "D1's free tier caps one database at 500 MB. Feedback is bounded at ~39 MB (FEEDBACK_DAILY_CEILING 100/day x 90-day retention purged before every insert = 9,000 rows x at most 4,000 B of text + 256 B of page + overhead); event_counts is well under 1 MB a year."

  - name: kv_writes_per_day
    ceiling: 1000
    estimate_at_1000_users_per_day: 0
    notes: "No KV writes in v1; reserved for config."

  - name: r2_storage_gb
    ceiling: 10
    estimate_at_1000_users_per_day: 1
    notes: "Account-wide (the document product's document-media holds about 0.9 GB). This product's bucket `omnibus` holds the daily snapshots of void news's printed day: about 2.5 MB a day, about 0.9 GB a year, independent of visitors. R2 bills past its free tier, so sizes are capped in code: 2 MiB a file and 8 MiB a day (scripts/lib/snapshot.mjs LIMITS, under 3 GB a year at the cap), and the uploader refuses to grow the bucket past 3 GiB (scripts/lib/snapshot-store.mjs BUCKET_CAP_BYTES), 30% of the account's 10 GB. tests/snapshot.test.ts checks both against this row. Episode media will add its own line when the player ships."

  - name: r2_draft_render_gb
    ceiling: 10
    estimate_at_1000_users_per_day: 1
    cap_gib: 1
    bucket: omnibus-capture
    prefix: render/
    notes: "Account-wide R2 storage, the share the Actions draft render may hold (C8, .github/workflows/episode-draft.yml), used only when the R2 secrets are set. Independent of visitors. Every upload (each stage's hand-off and the published outputs, keyed render/<issue>/<run>/) is refused when its bytes plus what render/ already lists exceed cap_gib (scripts/lib/draft-outputs.mjs r2CapProblem); a run deletes its own stage/ hand-offs once it publishes, and any earlier run of the same issue before it uploads. Account worst case with the other shares: 3 GiB snapshots + 1.5 GiB capture + 1 GiB render + 0.9 GB document = 6.8 GB, under the 7 GB alert. A whole-film package with --layers (ProRes plates) is far over 1 GiB, so such a run goes by the artifact route (every item public) or is refused; the 120 s slice measured 2.5 GiB of outputs, also over. tests/c8-draft.test.ts checks the shares."

  - name: r2_class_a_ops_per_month
    ceiling: 1000000
    estimate_at_1000_users_per_day: 2200
    notes: "Writes, independent of visitors. A new printed day puts its blobs once (at most 60 deep dives + 3 core files, about 48 today), then its manifest, the index and the latest pointer; every run puts the heartbeat. A later run that finds the same edition (an unrelated void news commit included, since the commit is not part of the content hash) writes only the heartbeat; a merge puts only the files that changed (a new weekly issue is one blob). So at most about 31 x (63 + 3 + 2) = 2,108 a month, plus a rare reprint; deletes are free."

  - name: r2_class_b_ops_per_month
    ceiling: 10000000
    estimate_at_1000_users_per_day: 2000
    notes: "Reads. The uploader reads 3 objects a run (about 180 a month); GET /api/snapshots/heartbeat reads one object per request, behind the per-client rate limit, polled by the sentinel; the normaliser reads a week's snapshots once a week. Visitors never read R2 in v1."

  - name: github_actions_minutes_per_month
    ceiling: 2000
    estimate_at_1000_users_per_day: 480
    notes: "gate on every PR/push, verify-production every 6 hours, weekly branch-prune, and the snapshot twice a day (about 3 minutes a run, about 180 minutes a month). episode-draft (C8) is dispatched by hand, at most a few runs a week: a 120 s slice measured 23 runner-minutes across its five jobs (route, graphics 10, narration 3, sources 2, render 8; 18 min wall), and a whole film is estimated at about 60 runner-minutes, so 4 drafts a month add about 240. Public repos are not billed for minutes; the figure is kept as the check."
    episode_draft_minutes_per_run: 60
